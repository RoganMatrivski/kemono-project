[package]
name = "kemono-core"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", features = ["gzip", "json", "query", "cookies", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
